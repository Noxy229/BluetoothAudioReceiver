name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/Receiver.Tests.csproj -c Release

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-22.04
            runtime: linux-x64
          - os: ubuntu-22.04
            runtime: linux-arm64
          - os: macos-14
            runtime: osx-x64
          - os: macos-14
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Read version
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' BluetoothAudioReceiver.csproj)
          desktop_version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Desktop/BluetoothAudioReceiver.Desktop.csproj)
          test "$version" = "$desktop_version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish BluetoothAudioReceiver.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts
          Copy-Item publish/BluetoothAudioReceiver.exe artifacts/BluetoothAudioReceiver-win-x64.exe
      - name: Publish desktop
        if: runner.os != 'Windows'
        run: dotnet publish Desktop/BluetoothAudioReceiver.Desktop.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -o publish
      - name: Install Linux packagers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm build-essential
          sudo gem install fpm --no-document
      - name: Package Linux
        if: runner.os == 'Linux'
        run: scripts/package-linux.sh '${{ matrix.runtime }}' "$APP_VERSION" publish artifacts
      - name: Package macOS AirPlay setup
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh '${{ matrix.runtime }}' "$APP_VERSION" publish artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime }}
          path: artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file ../RELEASE_NOTES.md ./*
